plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
    hibernateVersion   = '6.4.4.Final'
    jakartaPersistence = '3.1.0'
    springDataJpa      = '3.2.5'
}

dependencies {
    // ---- JPA / Hibernate (сгруппировано в начале) ----
    implementation "org.hibernate.orm:hibernate-core:${hibernateVersion}"
    implementation "jakarta.persistence:jakarta.persistence-api:${jakartaPersistence}"
    implementation "org.springframework.data:spring-data-jpa:${springDataJpa}"

    // ---- Остальные зависимости ----
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('bootRun') {
}
tasks.register('runTestDataInitializer') {
    group = 'verification'
    description = 'Заполняет БД тестовыми сообщениями через POST /api/messages'

    doLast {
        (1..10).each { i ->
            def payload = """{"content":"Test message #$i","authorId":1}"""
            exec {
                commandLine 'curl', '-s', '-X', 'POST',
                        'http://localhost:8080/api/messages',
                        '-H', 'Content-Type: application/json',
                        '-d', payload
            }
        }
        println 'Тестовые сообщения отправлены.'
    }
}