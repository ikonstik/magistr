services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_PASSWORD: workshop
      TZ: Europe/Moscow
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password workshop --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    profiles: ["compare"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: workshop

volumes:
  clickhouse-data:
